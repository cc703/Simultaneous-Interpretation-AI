<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Live Room Test Source</title>
    <style>
      :root {
        color: #e2e8f0;
        background: #0b0f19;
        font-family: "Noto Sans SC", "Microsoft YaHei", sans-serif;
      }

      body {
        min-height: 100vh;
        margin: 0;
        display: grid;
        place-items: center;
        background:
          radial-gradient(circle at 18% 20%, rgba(59, 130, 246, 0.18), transparent 32%),
          linear-gradient(135deg, #0b0f19, #111827 55%, #020617);
      }

      main {
        width: min(920px, calc(100vw - 32px));
        display: grid;
        gap: 18px;
        padding: 22px;
        border: 1px solid rgba(148, 163, 184, 0.18);
        border-radius: 12px;
        background: rgba(15, 23, 42, 0.9);
        box-shadow: 0 24px 80px rgba(0, 0, 0, 0.36);
      }

      header {
        display: flex;
        justify-content: space-between;
        gap: 18px;
        align-items: center;
      }

      h1,
      p {
        margin: 0;
      }

      h1 {
        font-size: 22px;
      }

      p {
        color: #94a3b8;
        line-height: 1.6;
      }

      .badge {
        display: inline-flex;
        align-items: center;
        gap: 8px;
        padding: 8px 12px;
        border: 1px solid rgba(16, 185, 129, 0.24);
        border-radius: 999px;
        color: #10b981;
        background: rgba(16, 185, 129, 0.08);
        font-size: 13px;
        font-weight: 700;
        white-space: nowrap;
      }

      .badge::before {
        width: 8px;
        height: 8px;
        border-radius: 999px;
        background: currentColor;
        content: "";
      }

      video,
      audio {
        width: 100%;
      }

      video {
        aspect-ratio: 16 / 9;
        border: 1px solid rgba(148, 163, 184, 0.18);
        border-radius: 10px;
        background: #020617;
      }

      .controls {
        display: grid;
        gap: 10px;
      }

      button {
        width: fit-content;
        min-height: 38px;
        padding: 0 14px;
        border: 1px solid rgba(59, 130, 246, 0.36);
        border-radius: 8px;
        color: #fff;
        background: #2563eb;
        cursor: pointer;
        font-weight: 800;
      }

      code {
        color: #93c5fd;
      }
    </style>
  </head>
  <body>
    <main>
      <header>
        <div>
          <h1>Live Room Test Source</h1>
          <p>Use this tab as a local livestream source for browser audio capture.</p>
        </div>
        <span class="badge">Broadcast audio ready</span>
      </header>

      <video id="live-video" src="/demo-media/sample-english-video.mp4" controls loop playsinline></video>

      <div class="controls">
        <button id="play">Play test broadcast</button>
        <p>
          Test path: open the interpreter app, switch to <code>Live</code>, click
          <code>Choose live audio</code>, select this tab, and enable tab audio sharing.
        </p>
      </div>
    </main>
    <script>
      const video = document.getElementById('live-video');
      document.getElementById('play').addEventListener('click', async () => {
        video.currentTime = 0;
        await video.play();
      });
    </script>
  </body>
</html>
