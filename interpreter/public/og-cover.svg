      <stop stop-color="#080c10"/>
      <stop offset=".62" stop-color="#0d1318"/>
      <stop offset="1" stop-color="#10202a"/>
    </linearGradient>
    <linearGradient id="line" x1="116" x2="1040" y1="306" y2="306" gradientUnits="userSpaceOnUse">
